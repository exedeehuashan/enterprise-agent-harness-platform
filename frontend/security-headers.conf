add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self' ${EAHP_CSP_CONNECT_EXTRA}; img-src 'self' data:; frame-ancestors 'none'" always;
