# Rendered by the nginx image's envsubst templates: only ${EAHP_BACKEND_UPSTREAM} is replaced.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Same-origin API: the browser never talks to the backend directly, so no CORS is needed.
    # The backend sets its own security headers on API responses.
    # Resolving the upstream per request (Docker's DNS) lets the console start before the backend.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /api/ {
        set $backend_upstream ${EAHP_BACKEND_UPSTREAM};
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # add_header in a location replaces inherited ones, so each static location includes these.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }
}
