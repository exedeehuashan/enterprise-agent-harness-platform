# Local EAHP stack. Start with scripts/deploy.sh (backs up first); see README "One-command local deployment".
# The project name is fixed so existing local data volumes are reused across checkouts.
name: enterprise-agent-harness-platform

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_harness
      POSTGRES_USER: agent_harness
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_harness -d agent_harness"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    image: eahp-backend:local
    container_name: eahp-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/agent_harness
      DB_USERNAME: agent_harness
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      EAHP_SECURITY_ADMIN_TOKEN: ${EAHP_SECURITY_ADMIN_TOKEN:?Set EAHP_SECURITY_ADMIN_TOKEN in .env}
      EAHP_SECURITY_OPERATOR_TOKEN: ${EAHP_SECURITY_OPERATOR_TOKEN:-}
      EAHP_SECURITY_VIEWER_TOKEN: ${EAHP_SECURITY_VIEWER_TOKEN:-}
      EAHP_QA_WORKDIR: /var/lib/eahp-qa
      EAHP_QA_VOLUME: eahp-qa-work
      # Per-commit environments (P36): this container joins each environment's network to reach it.
      EAHP_QA_SELF_CONTAINER: eahp-backend
      # Single sign-on (P46): an OIDC provider's issuer, and where EAHP fetches its keys (optional; docker-compose.sso.yml sets both for a local Keycloak).
      EAHP_SECURITY_OIDC_ISSUER: ${EAHP_SSO_ISSUER:-}
      EAHP_SECURITY_OIDC_JWKS_URI: ${EAHP_SSO_JWKS_URI:-}
      EAHP_GITHUB_POLL_ENABLED: ${EAHP_GITHUB_POLL_ENABLED:-false}
      EAHP_GITHUB_TOKEN: ${EAHP_GITHUB_TOKEN:-}
      # Optional: a token that may write commit statuses and pull request comments (QA write-back, P30).
      EAHP_GITHUB_WRITE_TOKEN: ${EAHP_GITHUB_WRITE_TOKEN:-}
      # Optional: the console's public URL, linked from GitHub commit statuses.
      EAHP_PUBLIC_URL: ${EAHP_PUBLIC_URL:-}
      # AI model (P33): mock (default), anthropic (Claude) or deepseek, with that provider's API key.
      EAHP_AI_PROVIDER: ${EAHP_AI_PROVIDER:-mock}
      EAHP_AI_DAILY_TOKEN_BUDGET: ${EAHP_AI_DAILY_TOKEN_BUDGET:-500000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-medium}
      EAHP_AI_ANTHROPIC_FALLBACKS: ${EAHP_AI_ANTHROPIC_FALLBACKS:-true}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      # Code agent (P35): Claude Code runs in this image (scripts/build-code-agent.sh) with ANTHROPIC_API_KEY above.
      EAHP_CODE_AGENT_IMAGE: ${EAHP_CODE_AGENT_IMAGE:-eahp-code-agent:local}
      EAHP_CODE_AGENT_MODEL: ${EAHP_CODE_AGENT_MODEL:-}
      # Email notifications (P41): an SMTP server for email subscriptions (chat robots need no configuration here).
      EAHP_SMTP_HOST: ${EAHP_SMTP_HOST:-}
      EAHP_SMTP_PORT: ${EAHP_SMTP_PORT:-587}
      EAHP_SMTP_USERNAME: ${EAHP_SMTP_USERNAME:-}
      EAHP_SMTP_PASSWORD: ${EAHP_SMTP_PASSWORD:-}
      EAHP_SMTP_FROM: ${EAHP_SMTP_FROM:-}
      EAHP_SMTP_STARTTLS: ${EAHP_SMTP_STARTTLS:-true}
      # Backup-restore drills (P42): nightly through the QA runner's Docker access, on this stack's network.
      EAHP_BACKUP_DRILL_ENABLED: ${EAHP_BACKUP_DRILL_ENABLED:-true}
      EAHP_BACKUP_DRILL_NETWORK: enterprise-agent-harness-platform_default
      EAHP_BACKUP_DRILL_IMAGE: postgres:16
      # Code agent egress (P37): "proxy" (default) allows only EAHP_CODE_AGENT_EGRESS_ALLOW through EAHP's proxy; "open" is unrestricted.
      EAHP_EGRESS_ENABLED: "true"
      EAHP_CODE_AGENT_NETWORK: ${EAHP_CODE_AGENT_NETWORK:-proxy}
      EAHP_CODE_AGENT_EGRESS_ALLOW: ${EAHP_CODE_AGENT_EGRESS_ALLOW:-api.anthropic.com,repo.maven.apache.org,repo1.maven.org,registry.npmjs.org}
    ports:
      - "127.0.0.1:${EAHP_BACKEND_PORT:-8080}:8080"
    # API tests (P24) reach systems under test published on the host, for example a local UAT stack.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - qa_work:/var/lib/eahp-qa
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  console:
    build: ./frontend
    image: eahp-console:local
    container_name: eahp-console
    restart: unless-stopped
    environment:
      EAHP_BACKEND_UPSTREAM: http://eahp-backend:8080
      # Single sign-on (P46): the identity provider's origin, which the console's login calls.
      EAHP_CSP_CONNECT_EXTRA: ${EAHP_SSO_ORIGIN:-}
    ports:
      - "127.0.0.1:${EAHP_CONSOLE_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  qa_work:
    # Test containers mount this volume by name (EAHP_QA_VOLUME), so the name must not be project-prefixed.
    name: eahp-qa-work
