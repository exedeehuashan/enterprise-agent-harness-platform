services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: agent_harness
      POSTGRES_USER: agent_harness
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_harness -d agent_harness"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
