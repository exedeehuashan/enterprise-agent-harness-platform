# Integration tests drive the worker explicitly against their own temporary database.
eahp.worker.enabled=false

# Fresh per-context credentials; functional API tests explicitly omit filters.
eahp.security.admin-token=${random.uuid}
eahp.security.operator-token=${random.uuid}
eahp.security.viewer-token=${random.uuid}

# Planning integration tests drive the planner explicitly.
eahp.planner.enabled=false
