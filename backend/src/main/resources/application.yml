spring:
  application:
    name: agent-harness-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agent_harness}
    username: ${DB_USERNAME:agent_harness}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: eahp
eahp:
  ai:
    provider: ${EAHP_AI_PROVIDER:mock}
    daily-token-budget: ${EAHP_AI_DAILY_TOKEN_BUDGET:500000}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-opus-5-5}
      effort: ${ANTHROPIC_EFFORT:medium}
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-chat}
